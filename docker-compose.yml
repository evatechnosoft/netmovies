# NetMovies — tek komutla ayağa kaldırma: docker compose up -d --build
# stream  : Web arayüzü + video proxy + API gateway (dışa açık :3310)
# engine  : KekikStream motoru + kendi eklentilerimiz + M3U listeleri (iç ağ)
# doh     : DNS-over-HTTPS resolver — ISP'nin DNS engelini aşar (engelli kaynak siteler)

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: ${NM_NET:-172.31.0}.0/24   # ZimaOS gibi 172.31/16 dolu hostta .env ile değiştir

volumes:
  # Cloudflare WARP kayıt/kimlik verisi (yeniden başlatmada tekrar kayıt olmasın)
  warp-data:

services:
  # Cloudflare WARP çıkış proxy'si: engine'in GİDEN HTTP(S) trafiğini WARP tüneli
  # üzerinden geçirir → TR ISP'nin SNI/DPI engelini aşar (dizilla, dizipal vb.).
  #
  # VARSAYILAN AÇIK. Eskiden `--profile warp` ile opt-in'di; ReadMe'deki normal
  # `docker compose up -d` WARP'ı başlatmıyor, SNI-bloklu kaynaklar sessizce
  # düşüyordu. Engine WARP'ı zaten SEÇİCİ kullanıyor (yalnız bloklu plugin'ler,
  # global HTTPS_PROXY yok) ve WARP ayakta değilse WARP'sız devam ediyor —
  # yani açık bırakmanın maliyeti yok, kapalı bırakmanın var.
  warp:
    image          : caomingjun/warp:latest
    container_name : netmovies-warp
    restart        : unless-stopped
    cap_add:
      - NET_ADMIN
      - MKNOD
      - AUDIT_WRITE
    device_cgroup_rules:
      - 'c 10:200 rwm'
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
    environment:
      # gost'a açıkça HTTP proxy listener söyle (sadece ":8080" auto-mode 503 verir).
      GOST_ARGS: "-L http://:8080"
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    networks:
      - internal

  # DNS-over-HTTPS: tüm konteynerlerin alan adı çözümlemesini HTTPS üzerinden
  # (Cloudflare/Google) yapar; ISP'nin DNS ile engellediği siteler çözülür.
  doh:
    # proxy-dns 2026.2.0'da kaldırıldı; son destekleyen sürüme pinlendi.
    image          : cloudflare/cloudflared:2026.1.2
    container_name : netmovies-doh
    restart        : unless-stopped
    command: >
      proxy-dns
      --address 0.0.0.0 --port 53
      --upstream https://1.1.1.1/dns-query
      --upstream https://1.0.0.1/dns-query
      --upstream https://8.8.8.8/dns-query
    networks:
      internal:
        ipv4_address: ${NM_NET:-172.31.0}.53

  engine:
    build          : ./engine
    container_name : netmovies-engine
    restart        : unless-stopped
    depends_on:
      doh:
        condition: service_started
    dns:
      - ${NM_NET:-172.31.0}.53          # DoH resolver (engelli domain'ler çözülsün)
      - 1.1.1.1              # Fallback 1 (Cloudflare Public DNS)
      - 8.8.8.8              # Fallback 2 (Google Public DNS)
    expose:
      - "3310"
    environment:
      # WARP proxy adresi — plugin'ler SEÇİCİ kullanır (sadece SNI-bloklu kaynaklar:
      # Dizilla/Dizipal). GLOBAL HTTPS_PROXY verilmez: WARP'ın CF çıkış IP'si bazı
      # kaynakları (HDFilmCehennemi/RecTV) bloklatıp movie=0 yapıyordu.
      WARP_PROXY: http://netmovies-warp:8080
      # Kendi M3U/M3U8 listeleriniz (virgülle ayrılmış dosya yolu veya URL).
      # Varsayılan: iptv-org'un bakımlı TR kanal listesi — RecTV'nin domain ailesi
      # (b.prectvNN.sbs) tamamen NXDOMAIN olduğu için Canlı TV bu listeden gelir.
      # `ozel.m3u` Yönetim panelinden yazılır (yoksa sessizce atlanır): yayıncının
      # resmi YouTube canlı yayınları da buraya eklenebilir, eklenti çözer.
      # Canlı TV kaynakları. `#tr` soneki = yalnız o ülkenin kanalları (iptv-org
      # kategori listeleri dünya çapında; süzgeçsiz eklemek listeyi çöpe çevirir).
      # Aynı akış birden çok listede geçerse eklenti URL bazında tekilleştirir.
      #   countries/tr    → Türkiye kanalları (asıl gövde)
      #   languages/tur   → yurtdışındaki Türkçe kanallar (Kanal D Drama, Timeless Dizi…)
      #   categories/movies#tr → 7/24 Türkçe film kanalları (beIN Box Office, MovieSmart…)
      #   categories/movies#secme → seçilmiş yabancı film kanalları (AMC, HBO Movies,
      #     Pluto TV Trending Now/Icons/Sci-Fi…) → "Yabancı Film" grubu
      M3U_SOURCES: ${M3U_SOURCES:-https://iptv-org.github.io/iptv/countries/tr.m3u,https://iptv-org.github.io/iptv/languages/tur.m3u,https://iptv-org.github.io/iptv/categories/movies.m3u#tr,https://iptv-org.github.io/iptv/categories/series.m3u#tr,https://iptv-org.github.io/iptv/categories/movies.m3u#secme,/data/lists/ozel.m3u}
      # Domainler otomatik keşfedilir (Kekik-cloudstream'den güncel çekilir).
      # Aşağıdakiler yalnızca elle SABİTLEMEK istersen; boşsa otomatik çalışır.
      RECTV_URL: ${RECTV_URL:-}
      HDFC_URL: ${HDFC_URL:-}
      DIZIYOU_URL: ${DIZIYOU_URL:-}
      DIZIBOX_URL: ${DIZIBOX_URL:-}
      DIZILLA_URL: ${DIZILLA_URL:-}
      DIZIMOM_URL: ${DIZIMOM_URL:-}
      KULTFILMLER_URL: ${KULTFILMLER_URL:-}
      FILMMAKINESI_URL: ${FILMMAKINESI_URL:-}
      ENGINE_WORKERS: ${ENGINE_WORKERS:-2}
      AUTO_DISCOVER_DOMAINS: ${AUTO_DISCOVER_DOMAINS:-0}
    volumes:
      - ./lists:/data/lists:ro
    networks:
      - internal

  stream:
    build          : ./stream
    container_name : netmovies-stream
    restart        : unless-stopped
    depends_on:
      engine:
        # Engine "başladı" değil "sağlıklı" (plugin'ler yüklü, /api/v1/health 200)
        # olana dek stream beklesin → cold-start'ta gateway'in engine'e erken proxy
        # yapıp 502 dönmesi biter. Healthcheck engine Dockerfile'ında tanımlı.
        condition: service_healthy
      doh:
        condition: service_started
    dns:
      - ${NM_NET:-172.31.0}.53          # DoH resolver
      - 1.1.1.1              # Fallback 1 (Cloudflare Public DNS)
      - 8.8.8.8              # Fallback 2 (Google Public DNS)
    # Kutu gücü köprüsü (atv servisi, host ağında) 3311'de: stream ona
    # TCP açamıyor ama host'a açabiliyor. Özel `dns:` yüzünden Docker'ın kendi
    # DNS'i devrede değil, bu yüzden isim /etc/hosts'a yazılıyor.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3310:3310"
    environment:
      PROVIDER_NAME        : NetMovies
      PROVIDER_DESCRIPTION : Kişisel, reklamsız izleme arayüzü.
      DEFAULT_PROVIDER_URL : http://engine:3310
      ADMIN_CONFIG_PATH    : /data/admin.json
      # 4K/yüksek bitrate için proxy segment cache (donmaya karşı)
      SEGMENT_CACHE_MB     : ${SEGMENT_CACHE_MB:-512}
      SEGMENT_DISK_CACHE_MB: ${SEGMENT_DISK_CACHE_MB:-2048}
      # Tek worker: sağlayıcı cache + inflight dedup (bkz. API/v1/Libs/__init__.py)
      # süreç-içi (in-memory). Çok worker'da her süreç ayrı cache tutar → dedup
      # işlemez, soğuk çağrılar tekrarlanır. Kişisel kullanım için 1 worker yeterli.
      WEB_WORKERS          : ${WEB_WORKERS:-1}
      # Basic Auth — .env'den okunur. Sabit "" bırakıldığı sürece .env doldurulsa bile
      # auth KAPALI kalıyordu ve public tünel (w.evaitec.com) admin dahil şifresiz
      # açıktı. AUTH_USER boşsa middleware kendini devre dışı bırakır (bkz. _auth.py),
      # yani yerel-only kullanımda .env'i boş bırakmak hâlâ mümkün.
      AUTH_USER            : ${AUTH_USER:-}
      AUTH_PASS            : ${AUTH_PASS:-}
      # Yönetim paneli parolası — izleme açık kalırken /admin ve /api/admin kilitlenir.
      # Boşsa koruma yok. Public tünelde MUTLAKA dolu olmalı.
      ADMIN_PASS           : ${ADMIN_PASS:-}
      PROXY_TOKEN_SECRET   : ${PROXY_TOKEN_SECRET:-}
      # Proxy'nin ulaşmasına izin verilen iç ağ blokları (CIDR, virgülle ayrık).
      # İnternet zaten serbest; bu liste yalnız özel/LAN adresleri açar. Varsayılan
      # ev LAN'ı: 192.168.0.x ve 192.168.1.x. Boş bırakılırsa iç ağ tamamen kapalı.
      PROXY_ALLOWED_NETS   : ${PROXY_ALLOWED_NETS:-192.168.0.0/16}
      # Video proxy'nin YEDEK çıkışı. Global proxy DEĞİL: yalnız kaynak 403/451
      # döndüğünde (ISP engeli — VidMoly gibi) o istek WARP'tan tekrarlanır.
      WARP_PROXY           : http://netmovies-warp:8080
      # Poster fallback: kaynak posteri boş/kırık gelince TMDB'den çekilir.
      TMDB_API_KEY         : ${TMDB_API_KEY:-}
      # Ev YZ geçidi (LiteLLM, infra/yz/): doluysa Gemini istekleri oraya gider,
      # ör. http://192.168.1.186:4000/v1. Boşsa Google doğrudan çağrılır.
      YZ_GECIT_URL         : ${YZ_GECIT_URL:-}
      YZ_GECIT_KEY         : ${YZ_GECIT_KEY:-}   # geçidin bu uygulamaya verdiği sanal anahtar
      # Kayıtlar: varsayılan hızlar (Mbit/s, TV Ayarlar ezer), boş alan tavanı (GB, altına inince izlenen silinir).
      KAYIT_IZLERKEN_MBIT  : ${KAYIT_IZLERKEN_MBIT:-3}
      KAYIT_BOSTA_MBIT     : ${KAYIT_BOSTA_MBIT:-7}
      KAYIT_MIN_BOS_GB     : ${KAYIT_MIN_BOS_GB:-20}
    volumes:
      - ./data:/data
      # Yönetim panelindeki "Canlı Kanallar" kartı buraya yazar, engine oradan okur.
      - ./lists:/lists
      # Kayıtlar (elle seçilen bölüm/film, internetsiz oynatma). ZimaOS'ta .env:
      # KAYIT_HOST_DIR=/DATA/sata/netmovies-kayitlar (boş 220G disk).
      - ${KAYIT_HOST_DIR:-./kayitlar}:/kayitlar
    networks:
      - internal

  # Hibrit: içerik evde kalır, w.evaitec.com Cloudflare Tunnel ile eve bağlanır.
  # Etkinleştirmek için: CF_TUNNEL_TOKEN ver ve `docker compose --profile tunnel up -d`
  cloudflared:
    image          : cloudflare/cloudflared:latest
    container_name : netmovies-tunnel
    restart        : unless-stopped
    # UDP/QUIC bu makinede erişilebilir değil; TCP/HTTP2 ile tünel bağlantısı.
    command        : tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    depends_on:
      - stream
    # cloudflared, stream'in ağ namespace'ini paylaşır → Cloudflare ingress'teki
    # origin `http://localhost:3310` doğrudan stream'e denk gelir (ayrı container'da
    # localhost boş kalıyordu → 502). Böylece dashboard config'e dokunmaya gerek yok.
    network_mode: "service:stream"
    profiles:
      - tunnel

  # Mi Box güç/tuş köprüsü (scripts/atv_power.py, Android TV Remote v2). Host ağında:
  # kutuya LAN'dan konuşur, stream ona host.docker.internal:3311 ile ulaşır.
  # Eşleşme sertifikası data/atv'de (bir kez `--eslestir`). Yalnız KAPATIR; uykudaki
  # kutu ağda yok, açmak TV kumandası/CEC'te kalır.
  # ponytail: her başlangıçta pip kurar (internet ister); sık yeniden başlarsa küçük imaj yap.
  atv:
    image          : python:3.12-slim
    container_name : netmovies-atv
    restart        : unless-stopped
    network_mode   : host
    working_dir    : /app
    command        : sh -c "pip install -q --no-cache-dir androidtvremote2 && python -u scripts/atv_power.py"
    environment:
      ATV_HOST: ${ATV_HOST:-192.168.1.105}
      ATV_PORT: "3311"
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data/atv:/app/data/atv
