org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Stream servis adresi build sırasında BASE_URL'e gömülür.
# Boş bırakırsan güvenli public adres kullanılır. LAN'a sabitlemek istersen örnek:
# NETMOVIES_BASE_URL=http://192.168.0.28:3310
NETMOVIES_BASE_URL=

# R8 "full mode" kotlinx.serialization ve Retrofit ile ek kural istiyor; saat
# uygulamasi 0.1.14'te bu yuzden acilmadi. Muhafazakar mod kucultmeyi surdurur.
android.enableR8.fullMode=false
