# docker-compose.dev.yml — GELİŞTİRME (otonom reload) — OPT-IN
#
# ⚠️ Bu dosya artık OTOMATİK UYGULANMAZ (eski adı override.yml idi; auto-merge
# olduğu için Windows'ta startup'ı kilitliyordu). Açıkça çağırırsın:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Amaç: kod (host) değiştiğinde container kendini yeniden kaldırsın — elle
# `--build` GEREKMEZ. `git pull` yeter; watchmedo değişikliği görür, basla.py'yi
# baştan çalıştırır → minify_assets + bundle_css + uvicorn yeniden (JS/CSS dahil).
#
# PRODUCTION / ZimaOS 7/24 (VARSAYILAN — bu dosyayı KATMA):
#   docker compose -f docker-compose.yml up -d --build
#   (güncelleme: git pull && docker compose -f docker-compose.yml up -d --build)
#
# PLATFORM:
# - ZimaOS/Linux → watchmedo native inotify ile çalışır (opt-in dev için uygun).
# - Windows/Docker Desktop → inotify bind-mount'a geçmez; bu dosyayı KULLANMA,
#   base compose + elle rebuild kullan. (İllâ istersen watchmedo komutuna
#   `--debug-force-polling` ekle; CPU'yu yer.)
#
# Not: kod image'dan değil host'tan (volume) okunur; ilk kurulumda yine bir kez
# `... up -d --build` gerekir (bağımlılıklar image'da kurulu).

services:
  engine:
    # Kod mount (base'deki ./lists mount'u ile birleşir)
    volumes:
      - ./engine:/usr/src/KekikStreamAPI
    command: >
      sh -c "pip install --no-cache-dir watchdog >/dev/null 2>&1 &&
      watchmedo auto-restart
      --directory=/usr/src/KekikStreamAPI --recursive
      --patterns='*.py'
      --ignore-patterns='*/.git/*;*/__pycache__/*'
      -- python3 basla.py"

  stream:
    # Kod mount (base'deki ./data mount'u ile birleşir)
    volumes:
      - ./stream:/usr/src/Stream
    command: >
      sh -c "pip install --no-cache-dir watchdog >/dev/null 2>&1 &&
      watchmedo auto-restart
      --directory=/usr/src/Stream --recursive
      --patterns='*.py;*.j2;*.js;*.css'
      --ignore-patterns='*/.git/*;*/__pycache__/*;*.min.js;*.min.css'
      -- python3 basla.py"
