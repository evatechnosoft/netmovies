model_list:
  - model_name: yerel
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: http://ollama-ollama-1:11434
      rpm: 30
  - model_name: gemini
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      rpm: 30
  # Web search (grounding) + vision: flash-lite has no free grounding quota (429), flash does.
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      rpm: 10

router_settings:
  # Gemini down or out of quota -> answer from the local model instead.
  fallbacks: [{"gemini": ["yerel"]}, {"gemini-flash": ["gemini", "yerel"]}]

litellm_settings:
  drop_params: true

general_settings:
  # No key, no answer. Apps use their own virtual key; the master key only issues keys.
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
